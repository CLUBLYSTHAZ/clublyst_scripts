name: Audit
on: workflow_dispatch
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/build-conditions-live.mjs
        env:
          REQUIRE_SUPABASE_UPSERT: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: course-conditions-live
          path: src/data/course-conditions-live.json
      - run: node scripts/audit-conditions-scoring.mjs > audit-output.json
      - uses: actions/upload-artifact@v4
        with:
          name: audit-output
          path: audit-output.json
